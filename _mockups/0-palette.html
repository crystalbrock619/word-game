<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Scrambler — Palette reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Red+Rose&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141327; --surface:#26215C; --text:#EEEDFE; --muted:#AFA9EC;
  --accent:#D85A30; --accent-light:#F0997B; --correct:#97C459; --present:#EF9F27;
  --absent:#A32D2D; --line:#3C3489; --slot:#7F77DD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0a16;color:var(--text);font-family:'Red Rose',sans-serif;padding:32px 16px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:28px}
.caption{font-size:13px;color:#8a86b8;font-family:'Red Rose',sans-serif;margin-bottom:8px}
.screen{background:var(--bg);border-radius:14px;padding:28px 20px}
.o{font-family:'Orbitron',sans-serif}
.tile{width:46px;height:52px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:500;font-family:'Orbitron',sans-serif}
.tile.correct{background:var(--correct);color:#173404}
.tile.present{background:var(--present);color:#412402}
.tile.absent{background:var(--absent);color:#FCEBEB}
.tile.idle{background:var(--surface);border:2px solid var(--slot);color:var(--text)}
.tile.used{background:var(--surface);border:2px solid var(--line);color:var(--line);opacity:.35}
.tile.slot{background:var(--bg);border:2px dashed var(--line);color:var(--line)}
.tile.slot.active{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:9px;justify-content:center}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
button{font-family:'Orbitron',sans-serif;cursor:pointer}
.btn{background:var(--accent);color:#FAECE7;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:500}
.ghost{background:transparent;color:var(--text);border:2px solid var(--accent);border-radius:8px;padding:10px 20px;font-size:14px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw div p{font-size:11px;margin-top:5px;color:var(--muted)}
.sw div p b{display:block;color:var(--text);font-weight:400;font-size:12px}
.chip{height:54px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <section>
    <p class="caption">0 · palette reference</p>
    <div class="screen">
      <div class="sw">
        <div><div class="chip" style="background:#141327;border:1px solid #3C3489"></div><p><b>background</b>#141327</p></div>
        <div><div class="chip" style="background:#26215C"></div><p><b>surface</b>#26215C</p></div>
        <div><div class="chip" style="background:#EEEDFE"></div><p><b>text</b>#EEEDFE</p></div>
        <div><div class="chip" style="background:#AFA9EC"></div><p><b>text muted</b>#AFA9EC</p></div>
        <div><div class="chip" style="background:#D85A30"></div><p><b>accent</b>#D85A30</p></div>
        <div><div class="chip" style="background:#97C459"></div><p><b>correct</b>#97C459</p></div>
        <div><div class="chip" style="background:#EF9F27"></div><p><b>present</b>#EF9F27</p></div>
        <div><div class="chip" style="background:#A32D2D"></div><p><b>absent</b>#A32D2D</p></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
