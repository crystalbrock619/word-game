<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Scrambler — Playing screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Red+Rose&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141327; --surface:#26215C; --text:#EEEDFE; --muted:#AFA9EC;
  --accent:#D85A30; --accent-light:#F0997B; --correct:#97C459; --present:#EF9F27;
  --absent:#A32D2D; --line:#3C3489; --slot:#7F77DD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0a16;color:var(--text);font-family:'Red Rose',sans-serif;padding:32px 16px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:28px}
.caption{font-size:13px;color:#8a86b8;font-family:'Red Rose',sans-serif;margin-bottom:8px}
.screen{background:var(--bg);border-radius:14px;padding:28px 20px}
.o{font-family:'Orbitron',sans-serif}
.tile{width:46px;height:52px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:500;font-family:'Orbitron',sans-serif}
.tile.correct{background:var(--correct);color:#173404}
.tile.present{background:var(--present);color:#412402}
.tile.absent{background:var(--absent);color:#FCEBEB}
.tile.idle{background:var(--surface);border:2px solid var(--slot);color:var(--text)}
.tile.used{background:var(--surface);border:2px solid var(--line);color:var(--line);opacity:.35}
.tile.slot{background:var(--bg);border:2px dashed var(--line);color:var(--line)}
.tile.slot.active{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:9px;justify-content:center}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
button{font-family:'Orbitron',sans-serif;cursor:pointer}
.btn{background:var(--accent);color:#FAECE7;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:500}
.ghost{background:transparent;color:var(--text);border:2px solid var(--accent);border-radius:8px;padding:10px 20px;font-size:14px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw div p{font-size:11px;margin-top:5px;color:var(--muted)}
.sw div p b{display:block;color:var(--text);font-weight:400;font-size:12px}
.chip{height:54px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <section>
    <p class="caption">2 · playing — the primary screen</p>
    <div class="screen">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="o" style="font-size:12px;color:var(--muted)">CRYSTAL</span>
        <span class="o" style="font-size:12px;color:var(--muted)">GUESS 2 / 3</span>
        <span class="o" style="font-size:17px;color:var(--present);font-weight:700">7 &cent;</span>
      </div>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--line)">
        <span style="font-size:13px;color:var(--muted)">save my progress</span>
        <span style="width:28px;height:16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;padding:2px">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--muted)"></span>
        </span>
      </div>

      <p class="o" style="text-align:center;font-size:20px;font-weight:700;color:var(--present);letter-spacing:3px;margin-bottom:14px">TWISTED</p>
      <p class="lbl">drop letters here</p>
      <div class="row" style="margin-bottom:24px">
        <div class="tile idle">P</div>
        <div class="tile idle">L</div>
        <div class="tile slot active">&middot;</div>
        <div class="tile slot">&middot;</div>
        <div class="tile slot">&middot;</div>
      </div>

      <p class="lbl">your letters</p>
      <div class="row" style="margin-bottom:22px">
        <div class="tile used">P</div>
        <div class="tile used">L</div>
        <div class="tile idle">A</div>
        <div class="tile idle">E</div>
        <div class="tile idle">T</div>
      </div>

      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px">
        <button class="btn">Check</button>
        <button class="ghost">Shuffle</button>
        <button class="ghost">Clear</button>
      </div>

      <div style="background:var(--surface);border-radius:8px;padding:12px 14px">
        <p style="font-size:11px;color:var(--muted);margin-bottom:8px">last guess &middot; pleat</p>
        <div class="row" style="gap:6px">
          <div class="tile correct" style="width:34px;height:34px;font-size:15px">P</div>
          <div class="tile correct" style="width:34px;height:34px;font-size:15px">L</div>
          <div class="tile present" style="width:34px;height:34px;font-size:15px">E</div>
          <div class="tile present" style="width:34px;height:34px;font-size:15px">A</div>
          <div class="tile absent"  style="width:34px;height:34px;font-size:15px">T</div>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
