<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Scrambler — 5 · desktop layout (cabinet + fluid)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Press+Start+2P&family=Red+Rose&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141327; --surface:#26215C; --text:#EEEDFE; --muted:#AFA9EC;
  --accent:#D85A30; --accent-light:#F0997B; --correct:#97C459; --present:#EF9F27;
  --absent:#A32D2D; --line:#3C3489; --slot:#7F77DD;

  /* ---- fluid with the window, fixed against word length ----
     The frame is sized ONCE, for the longest word in words.json (12
     letters). Tile size is then whatever makes 12 fit exactly — so a
     4-letter word and a 12-letter word use identical tiles and the
     frame never moves between rounds. Short words simply centre with
     air either side, which is the point: a frame that resizes per word
     makes the whole cabinet twitch every time a word is served. */
  --longest:12;
  --card:clamp(320px, 93vw, 820px);
  --gap:clamp(4px, .8vw, 10px);

  /* ---- spacing scale ----
     Three steps only. --space-lg separates the major blocks, --space-md
     separates the two halves of the rack, --space-sm ties a label to the
     thing it labels. Everything in the card uses one of these; no
     one-off margins, which is what made it feel crowded and uneven. */
  --pad:clamp(20px, 2.8vw, 38px);
  --space-lg:clamp(18px, 2.4vw, 34px);
  --space-md:clamp(14px, 1.9vw, 26px);
  --space-sm:clamp(7px, .95vw, 13px);
  --tile-w:calc((var(--card) - 2*var(--pad) - 11*var(--gap)) / 12);
  --tile-h:calc(var(--tile-w) * 1.14);
  --tile-fs:calc(var(--tile-w) * .46);
  --mini:calc(var(--tile-w) * .62);

  /* Pool tiles are the source, slots are the target. The target gets the
     larger hit area — which is the right way round for a drag — and the
     pool row costs less height. Floored on touch only, further down. */
  --pool-scale:.78;
  --pool-w:calc(var(--tile-w) * var(--pool-scale));
  --pool-h:calc(var(--pool-w) * 1.14);
}
*{box-sizing:border-box;margin:0;padding:0}

.o{font-family:'Orbitron',sans-serif}
.tile{width:46px;height:52px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:500;font-family:'Orbitron',sans-serif}
.tile.correct{background:var(--correct);color:#173404}
.tile.present{background:var(--present);color:#412402}
.tile.absent{background:var(--absent);color:#FCEBEB}
.tile.idle{background:var(--surface);border:2px solid var(--slot);color:var(--text)}
.tile.used{background:var(--surface);border:2px solid var(--line);color:var(--line);opacity:.35}
.tile.slot{background:var(--bg);border:2px dashed var(--line);color:var(--line)}
.tile.slot.active{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:9px;justify-content:center}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
button{font-family:'Orbitron',sans-serif;cursor:pointer}
.btn{background:var(--accent);color:#FAECE7;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:500}
.ghost{background:transparent;color:var(--text);border:2px solid var(--accent);border-radius:8px;padding:10px 20px;font-size:14px}

/* ============================================================
   CABINET — the page fills the viewport; the card does not
   ============================================================ */
body{background:#08070f;color:var(--text);font-family:'Red Rose',sans-serif;
  min-height:100vh;display:grid;place-items:center;
  padding:clamp(14px,3vh,44px) clamp(12px,2vw,28px);position:relative;overflow-x:hidden}

/* ambient light spilling off the cabinet, so the corners of a big
   monitor are lit rather than dead black */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 55% at 50% 42%, rgba(216,90,48,.16) 0%, rgba(216,90,48,0) 70%),
    radial-gradient(90% 70% at 50% 100%, rgba(38,33,92,.55) 0%, rgba(38,33,92,0) 70%)}

.cabinet{position:relative;z-index:1;width:clamp(320px, 94vw, 940px);
  display:grid;justify-items:center;gap:clamp(8px,1.3vw,16px)}

/* ---- lit marquee ---- */
.marquee{width:100%;text-align:center;border:2px solid var(--accent);border-radius:14px;
  padding:clamp(9px,1.5vw,18px) clamp(14px,2vw,26px);
  background:linear-gradient(180deg,#2b1733 0%,#171532 55%,#101026 100%);
  box-shadow:0 0 34px rgba(216,90,48,.22), inset 0 0 26px rgba(239,159,39,.10)}
.marquee h1{font-family:'Orbitron',sans-serif;font-weight:700;line-height:1.1;
  font-size:clamp(15px,2.7vw,32px);letter-spacing:clamp(2px,.55vw,8px);
  color:var(--present);text-shadow:0 0 16px rgba(239,159,39,.5)}
.marquee p{font-family:'Orbitron',sans-serif;font-size:clamp(8px,.85vw,11px);
  letter-spacing:clamp(2px,.4vw,5px);color:var(--accent-light);margin-top:5px}

/* ---- bezel ---- */
.bezel{position:relative;width:100%;border:3px solid var(--accent);border-radius:20px;
  padding:clamp(10px,1.7vw,26px);background:#0d0c1a;
  box-shadow:0 0 0 1px rgba(0,0,0,.7), 0 0 70px rgba(216,90,48,.15),
             inset 0 0 46px rgba(0,0,0,.75)}
.bezel::after{content:"";position:absolute;inset:5px;border-radius:15px;
  border:1px solid rgba(175,169,236,.16);pointer-events:none}

/* scanlines — kept faint; they sit over the bezel, never over the tiles' text
   weight enough to cost legibility. Toggle below to compare. */
.scan{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(to bottom,
    rgba(238,237,254,.05) 0px, rgba(238,237,254,.05) 1px,
    rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)}

/* ---- the play card, now fluid ---- */
.screen{background:var(--bg);border-radius:14px;padding:var(--pad);
  width:var(--card);max-width:100%;margin:0 auto;position:relative;z-index:2}

/* one tile size, every word */
.tile{width:var(--tile-w);height:var(--tile-h);font-size:var(--tile-fs);
  border-radius:clamp(5px,.7vw,9px);flex:none}
.row{gap:var(--gap)}
.tile.mini{width:var(--mini);height:var(--mini);font-size:calc(var(--mini)*.44)}
.mini-row{gap:calc(var(--gap)*.7)}

/* the pool sits below the slots and is deliberately the smaller of the two */
.pool .tile{width:var(--pool-w);height:var(--pool-h);
  font-size:calc(var(--pool-w)*.46);border-radius:clamp(4px,.6vw,8px)}
.pool{gap:calc(var(--gap)*.9)}
.coins{display:inline-flex;align-items:center;gap:5px}
.coin{width:clamp(15px,1.6vw,21px);height:clamp(15px,1.6vw,21px);flex:none;display:block}

/* ---- spacing inside the card ---- */
.hdr{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:var(--space-sm);gap:var(--space-sm)}
.meta{font-size:clamp(11px,1.15vw,14px);color:var(--muted)}
.savebar{display:flex;justify-content:flex-end;align-items:center;gap:10px;
  margin-bottom:var(--space-lg);padding-bottom:var(--space-sm);
  border-bottom:1px solid var(--line)}
.savelbl{font-size:clamp(12px,1.15vw,15px);color:var(--muted)}
.tier{text-align:center;font-weight:700;color:var(--present);
  font-size:clamp(16px,2.1vw,26px);letter-spacing:clamp(3px,.5vw,6px);
  margin-bottom:var(--space-lg)}
.lbl{font-size:clamp(11px,1.1vw,14px);margin-bottom:var(--space-sm)}
.rack-row{margin-bottom:var(--space-md)}
.rack-row + .lbl{margin-top:var(--space-sm)}   /* extra air between the two halves */
.controls{display:flex;flex-wrap:wrap;justify-content:center;
  gap:clamp(9px,1.2vw,15px);margin-top:var(--space-lg);margin-bottom:var(--space-lg)}
.btn{padding:clamp(11px,1.35vw,17px) clamp(24px,3.1vw,40px);
  font-size:clamp(13px,1.5vw,17px);border-radius:clamp(7px,.9vw,11px)}
.ghost{padding:clamp(9px,1.15vw,15px) clamp(17px,2.3vw,29px);
  font-size:clamp(12px,1.35vw,16px);border-radius:clamp(7px,.9vw,11px)}
.strip{background:var(--surface);border-radius:clamp(8px,1vw,12px);
  padding:clamp(13px,1.6vw,21px) clamp(14px,1.8vw,24px)}
.strip-lbl{font-size:clamp(10px,1.05vw,13px);color:var(--muted);
  margin-bottom:var(--space-sm)}

/* compact = the spacing before this pass, for side-by-side comparison */
body.compact{--pad:clamp(14px,2vw,28px);--space-lg:14px;--space-md:11px;--space-sm:6px}

/* ============================================================
   PRESS START 2P on the tiles
   Orbitron's D and O are the same rounded rectangle — unusable when
   reading one letter at a time is the whole game. A pixel grid cannot
   blur two glyphs together, which is why this one was picked.
   ============================================================ */
:root{
  --ps:'Press Start 2P', monospace;
  /* It carries far more width and height per em than Orbitron, so it
     needs its own ratio — .40 here against .46 for Orbitron. */
  --tile-fs-ps:calc(var(--tile-w) * .40);
  --pool-fs-ps:calc(var(--pool-w) * .40);
}
/* A pixel face wants a whole-pixel size or the grid goes soft against
   our fluid tile. round() snaps it; browsers without it just get the
   unsnapped value, which is a softness issue, not a breakage. */
@supports (width: round(down, 10px, 2px)){
  :root{
    --tile-fs-ps:round(down, calc(var(--tile-w) * .40), 2px);
    --pool-fs-ps:round(down, calc(var(--pool-w) * .40), 2px);
  }
}
.tile{font-family:var(--ps);font-size:var(--tile-fs-ps);
  line-height:1;letter-spacing:0;font-weight:400}
.pool .tile{font-size:var(--pool-fs-ps)}
.tile.mini{font-size:calc(var(--mini)*.36)}

/* ---- scope: everything (display type too, labels stay Red Rose) ---- */
body.font-all .o,
body.font-all .meta,
body.font-all .tier,
body.font-all button,
body.font-all .marquee h1,
body.font-all .marquee p{font-family:var(--ps);font-weight:400}
body.font-all .marquee h1{font-size:clamp(9px,1.65vw,20px);letter-spacing:clamp(1px,.22vw,3px);line-height:1.5}
body.font-all .marquee p{font-size:clamp(5px,.6vw,8px);letter-spacing:clamp(1px,.25vw,3px)}
body.font-all .meta{font-size:clamp(7px,.85vw,11px)}
body.font-all .tier{font-size:clamp(10px,1.45vw,18px);letter-spacing:clamp(1px,.2vw,3px)}
body.font-all .btn{font-size:clamp(8px,1.05vw,13px)}
body.font-all .ghost{font-size:clamp(7px,.95vw,12px)}
body.font-all .coins{font-size:clamp(10px,1.2vw,15px) !important}

/* ---- scope: none — Orbitron everywhere, the "before" ---- */
body.font-orbitron .tile{font-family:'Orbitron',sans-serif;font-weight:500;
  font-size:var(--tile-fs);line-height:normal}
body.font-orbitron .pool .tile{font-size:calc(var(--pool-w)*.46)}
body.font-orbitron .tile.mini{font-size:calc(var(--mini)*.44)}

/* Phones: 12 tiles across would be ~21px, too small to hit. Below 560px
   the rack switches to a 6-per-row regime and wraps — but the row height
   is RESERVED for two rows always, so the frame still does not move
   between a 4-letter word and a 12-letter one. Fixed, just a different
   fixed. */
@media (max-width:560px){
  :root{
    --tile-w:calc((var(--card) - 2*var(--pad) - 5*var(--gap)) / 6);
    /* touch floor — a 34px drag handle is not thumb-sized */
    --pool-w:max(42px, calc(var(--tile-w) * var(--pool-scale)));
  }
  .row{flex-wrap:wrap}
  .slots{min-height:calc(var(--tile-h)*2 + var(--gap))}
  .pool{min-height:calc(var(--pool-h)*2 + var(--gap))}
}

/* ---- pedestal ---- */
.base{width:min(78%,700px);height:clamp(8px,1.2vw,16px);border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#2b1733,#0d0c1a);border:1px solid var(--line);border-top:none;
  box-shadow:0 14px 40px rgba(0,0,0,.6)}

/* ============================================================
   MOCKUP CHROME — not part of the design, review controls only
   ============================================================ */
.panel{position:fixed;right:14px;bottom:14px;z-index:20;background:#131226;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:11px;color:var(--muted);display:grid;gap:7px;min-width:172px}
.panel b{color:var(--text);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px}
.panel label{display:flex;align-items:center;gap:7px;cursor:pointer}
.panel code{color:var(--present);font-size:11px}
.panel hr{border:none;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <h1>THE BRAIN SCRAMBLER</h1>
    <p>INSERT BRAIN</p>
  </div>

  <div class="bezel">
    <div class="scan" id="scan"></div>
    <div class="screen">
      <div class="hdr">
        <span class="o meta">CRYSTAL</span>
        <span class="o meta">GUESS 2 / 3</span>
        <span class="o coins" style="font-size:17px;color:var(--present);font-weight:700">7<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--present)" stroke="#8F5A0B" stroke-width="2"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#8F5A0B" stroke-width="1.2" opacity=".5"/><path d="M14.2 8.6a3.9 3.9 0 1 0 0 6.8" fill="none" stroke="#412402" stroke-width="2" stroke-linecap="round"/><path d="M12 6.4v11.2" stroke="#412402" stroke-width="2" stroke-linecap="round"/><ellipse cx="8.4" cy="7.4" rx="2.3" ry="1.3" fill="#FFF" opacity=".38" transform="rotate(-38 8.4 7.4)"/></svg></span>
      </div>
      <div class="savebar">
        <span class="savelbl">Save My Progress</span>
        <span style="width:28px;height:16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;padding:2px">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--muted)"></span>
        </span>
      </div>

      <p class="o tier">TWISTED</p>
      <p class="lbl">Drop Letters Here</p>
      <div class="row rack-row slots">
        <div class="tile idle">P</div>
        <div class="tile idle">L</div>
        <div class="tile slot active">&middot;</div>
        <div class="tile slot">&middot;</div>
        <div class="tile slot">&middot;</div>
      </div>

      <p class="lbl">Your Letters</p>
      <div class="row rack-row pool">
        <div class="tile used">P</div>
        <div class="tile used">L</div>
        <div class="tile idle">A</div>
        <div class="tile idle">E</div>
        <div class="tile idle">T</div>
      </div>

      <div class="controls">
        <button class="btn">Check</button>
        <button class="ghost">Shuffle</button>
        <button class="ghost">Clear</button>
      </div>

      <div class="strip">
        <p class="strip-lbl">Last Guess &middot; Pleat</p>
        <div class="row mini-row">
          <div class="tile mini correct">P</div>
          <div class="tile mini correct">L</div>
          <div class="tile mini present">E</div>
          <div class="tile mini present">A</div>
          <div class="tile mini present">T</div>
        </div>
      </div>
    </div>
  </div>

  <div class="base"></div>
</div>

<div class="panel">
  <b>MOCKUP CONTROLS</b>
  <label style="display:grid;gap:4px">Press Start 2P applies to
    <select id="fscope" style="background:#0d0c1a;color:var(--text);border:1px solid var(--line);
      border-radius:5px;padding:4px 6px;font-family:inherit;font-size:11px">
      <option value="">tiles only</option>
      <option value="font-all">everything</option>
      <option value="font-orbitron">nothing — Orbitron (before)</option>
    </select>
  </label>
  <label><input type="checkbox" id="cSquint"> squint test</label>
  <hr>
  <label><input type="checkbox" id="cScan" checked> scanlines</label>
  <label><input type="checkbox" id="cGlow" checked> ambient glow</label>
  <label><input type="checkbox" id="cLong"> 12-letter word</label>
  <label><input type="checkbox" id="cTight"> old tight spacing</label>
  <hr>
  <div>window <code id="ww">–</code></div>
  <div>card <code id="cw">–</code></div>
  <div>tile <code id="tw">–</code></div>
  <div>frame <code id="fh">–</code></div>
  <div id="drift" style="color:var(--correct)">frame shift on word change: –</div>
</div>

<script>
var $=function(i){return document.getElementById(i);};
var screenEl=document.querySelector(".screen");

$("cScan").onchange=function(){ $("scan").style.display=this.checked?"":"none"; };
$("cGlow").onchange=function(){ document.body.classList.toggle("noglow",!this.checked); };
$("cTight").onchange=function(){ document.body.classList.toggle("compact",this.checked); report(); };
$("fscope").onchange=function(){
  document.body.classList.remove("font-all","font-orbitron");
  if(this.value) document.body.classList.add(this.value);
  report();
};
/* blur approximates reading at a glance — glyphs that stay apart under
   blur stay apart in play */
$("cSquint").onchange=function(){
  document.querySelector(".cabinet").style.filter=this.checked?"blur(1.1px)":"";
};

/* swap in a 12-letter word to prove the worst case fits */
var short=screenEl.innerHTML;
var bezel=document.querySelector(".bezel");
$("cLong").onchange=function(){
  var before=Math.round(bezel.getBoundingClientRect().height);
  this._before=before;
  if(this.checked){
    var w="ABBREVIATION".split(""), s="",p="";
    for(var i=0;i<12;i++){ s+='<div class="tile '+(i<4?"idle":"slot")+'">'+(i<4?w[i]:"·")+'</div>'; }
    for(var j=0;j<12;j++){ p+='<div class="tile '+(j<4?"used":"idle")+'">'+w[(j*5)%12]+'</div>'; }
    screenEl.querySelectorAll(".row")[0].innerHTML=s;
    screenEl.querySelectorAll(".row")[1].innerHTML=p;
    screenEl.querySelector("p.o").textContent="OBLITERATED";
    screenEl.querySelector("p.o").style.color="var(--absent)";
  } else { screenEl.innerHTML=short; }
  report();
  var after=Math.round(bezel.getBoundingClientRect().height), d=after-this._before;
  $("drift").textContent="frame shift on word change: "+(d===0?"0px — held":d+"px");
  $("drift").style.color=d===0?"var(--correct)":"var(--absent)";
};

function report(){
  $("ww").textContent=window.innerWidth+"px";
  var c=document.querySelector(".screen"), t=document.querySelector(".tile");
  if(c) $("cw").textContent=Math.round(c.getBoundingClientRect().width)+"px";
  if(t) $("tw").textContent=Math.round(t.getBoundingClientRect().width)+"px";
  $("fh").textContent=Math.round(bezel.getBoundingClientRect().width)+" × "
    +Math.round(bezel.getBoundingClientRect().height)+"px";
}
window.addEventListener("resize",report); report();
</script>

<style>
body.noglow::before{display:none}
</style>
</body>
</html>
